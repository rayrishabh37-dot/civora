
name: Build Civora Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Civora
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare app
        run: |
          mkdir -p civora-android/www
          cp index.html civora-android/www/
          cp manifest.webmanifest civora-android/www/
          cd civora-android
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          echo '{"appId":"com.civora.study","appName":"Civora","webDir":"www"}' > capacitor.config.json
          npx cap add android

      - name: Build APK
        run: |
          cd civora-android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: civora-android-debug-apk
          path: civora-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
