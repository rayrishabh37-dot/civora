name: Build Civora Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Civora
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android packages
        shell: bash
        run: |
          set -e
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
      - name: Prepare Civora
        shell: bash
        run: |
          set -e
          mkdir -p civora-android/www
          cp index.html civora-android/www/
          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest civora-android/www/
          fi
          if [ -f service-worker.js ]; then
            cp service-worker.js civora-android/www/
          fi
          cd civora-android
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          echo '{"appId":"com.civora.study","appName":"Civora","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cat >> android/build.gradle <<'GRADLE'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' &&
                          details.requested.name.startsWith('kotlin-stdlib')) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          GRADLE
      - name: Build APK
        shell: bash
        run: |
          set -e
          cd civora-android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: civora-android-debug-apk
          path: civora-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
